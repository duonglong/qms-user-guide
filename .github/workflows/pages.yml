# Build the Quality Management System user guide with Sphinx and publish it on GitHub Pages.
name: Publish the user guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build (warnings fail the build)
        run: sphinx-build -W --keep-going -b html . _site/20.0/en
      - name: Redirect the site root to the current version
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Quality Management System — User guide</title>
          <meta http-equiv="refresh" content="0; url=20.0/en/"><link rel="canonical" href="20.0/en/">
          <p><a href="20.0/en/">Quality Management System — User guide (Odoo 20.0)</a></p>
          HTML
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
